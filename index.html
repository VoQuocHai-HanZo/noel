<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giáng Sinh An Lành</title>
<style>
:root{--text:#f5f7ff;--muted:#c3cbe6;--card:rgba(10,18,45,.62);--accent:#ff5a5f;--gold:#ffd54f;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--text);background:#0b1b3a;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(4,9,28,.5),rgba(4,9,28,.74)),var(--bg-img,none) center/cover no-repeat,linear-gradient(#0b1b3a,#1d3c63 70%,#2b5a7a)}
#snow{position:fixed;inset:0;z-index:4;pointer-events:none}
main{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:70px 18px 50px}
header{text-align:center;margin-bottom:34px}
header small{letter-spacing:.3em;color:var(--gold);font-size:.8rem}
h1{font-size:clamp(2.1rem,6.5vw,3.6rem);margin:8px 0;text-shadow:0 3px 18px rgba(0,0,0,.75)}
header p{color:var(--muted);max-width:520px;margin:0 auto;line-height:1.6}
.grid{display:grid;gap:16px;grid-template-columns:repeat(6,1fr)}
.card{grid-column:span 2;font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--card);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:22px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column;gap:8px;min-height:170px}
.card:nth-child(n+4){grid-column:span 3}
.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.card i{font-style:normal;font-size:1.8rem;width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.1)}
.card b{font-size:1.1rem;color:#ffe1e2}
.card span{color:var(--muted);font-size:.92rem;line-height:1.5;flex:1}
.card em{font-style:normal;color:var(--gold);font-size:.88rem}
footer{text-align:center;color:var(--muted);margin-top:34px;font-size:.85rem}
@media(max-width:760px){.card,.card:nth-child(n+4){grid-column:span 6;min-height:0}}
/* thông tin của tôi */
#me{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:6}
#meb{margin:0;background:rgba(10,18,45,.78);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px)}
#mel{margin-top:8px;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:rgba(10,18,45,.88);border:1px solid rgba(255,255,255,.2)}
#mel[hidden]{display:none}
#mel a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:.92rem;padding:4px 8px 4px 4px;border-radius:999px}
#mel a:hover{background:rgba(255,255,255,.14)}
#mel svg{width:34px;height:34px}
/* cửa sổ nội dung */
#modal{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(2,6,20,.45);backdrop-filter:blur(2px)}
#modal[hidden]{display:none}
#panel{position:relative;width:min(780px,100%);max-height:90vh;overflow:auto;background:rgba(8,14,38,.92);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.x{position:absolute;top:10px;right:12px;width:34px;height:34px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1rem;cursor:pointer;margin:0}
h2{font-size:1.4rem;margin-bottom:6px;padding-right:36px}
.hint{color:var(--muted);font-size:.92rem;margin-bottom:12px;line-height:1.5}
button{font:inherit;padding:9px 18px;border:0;border-radius:999px;cursor:pointer;background:var(--accent);color:#fff;margin:6px 6px 0 0}
button.alt{background:rgba(255,255,255,.16)}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;margin:4px 0 10px}
select option{color:#000}
label{font-size:.9rem;color:var(--muted)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:480px){.form2{grid-template-columns:1fr}}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tools button{margin:0;padding:5px;width:46px;height:46px;background:rgba(255,255,255,.1);border:2px solid transparent;border-radius:12px}
.tools button svg{width:100%;height:100%}
.tools button.on{border-color:var(--gold);background:rgba(255,213,79,.2)}
.treebox{position:relative;width:min(100%,340px);aspect-ratio:320/440;margin:0 auto;cursor:crosshair;touch-action:manipulation;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#18365e,#07101f 75%)}
.treebox>svg{width:100%;height:100%;display:block}
.orn{position:absolute;transform:translate(-50%,-50%);pointer-events:none;animation:pop .25s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.orn svg{width:36px;height:36px;display:block}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}
.res{display:grid;gap:10px;margin-top:12px}
.res a,.item,.pl{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;text-decoration:none;font:inherit;text-align:left;width:100%;border:0;margin:0;cursor:pointer}
.res a:hover,.pl:hover{background:rgba(255,255,255,.16)}
.em{font-size:2rem;width:56px;height:56px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.1);flex:none}
.res small,.item small{display:block;color:var(--muted);margin-top:2px;line-height:1.4}
.item{cursor:default}.item .lk a{color:var(--gold);margin-right:12px;font-size:.88rem}
.box{padding:14px;border-radius:12px;background:rgba(255,255,255,.07);margin-top:12px;line-height:1.6;font-size:.95rem}
.box ul{padding-left:20px;margin-top:6px}
.box a{color:var(--gold)}
.song{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.08)}
.song div{min-width:0}.song button{margin:0 0 0 6px;padding:7px 14px;white-space:nowrap}
.song a{color:var(--gold);font-size:.85rem}
.song small{color:var(--muted)}
canvas#viz{width:100%;height:130px;border-radius:12px;background:rgba(0,0,0,.35);margin-bottom:10px}
#lyr{min-height:70px;text-align:center;line-height:1.8;margin-bottom:12px;color:var(--muted)}
#lyr span{display:block;transition:.2s}#lyr .on{color:#fff;font-size:1.1rem;font-weight:600;text-shadow:0 0 10px var(--accent)}
.thiep{width:min(100%,420px);min-height:260px;margin:12px auto;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px;cursor:pointer;background:linear-gradient(135deg,#b71c1c,#d32f2f);border:3px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .3s}
.thiep:hover{transform:rotate(-1deg) scale(1.02)}
.thiep.open{background:linear-gradient(135deg,#fff8e1,#ffe9b0);color:#4a1a1a;cursor:default;animation:pop2 .5s}
.thiep.open:hover{transform:none}
.thiep p{line-height:1.7;font-size:1.02rem;font-style:italic}
@keyframes pop2{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
#santa{position:fixed;top:14%;left:0;z-index:3;width:140px;pointer-events:none;opacity:0}
#santa svg{width:100%;height:auto;display:block}
#santa.fly{opacity:1;animation:fly 14s linear forwards,bob 1.6s ease-in-out infinite}
@keyframes fly{from{left:-200px}to{left:100vw}}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-14px}}
@media(prefers-reduced-motion:reduce){#santa{display:none}}
</style>
</head>

<main>
<header><small>MERRY CHRISTMAS</small><h1>🎄 Giáng Sinh An Lành 🎄</h1><p>Trang trí cây thông, tìm nơi đón lễ, nghe nhạc Noel, chọn quà và gửi lời chúc đến người thân yêu.</p></header>
<section class="grid">
<button class="card" data-v="tree"><i>🎄</i><b>Cùng trang trí cây thông Noel</b><span>Một cây thông lớn đang chờ bạn treo bóng, sao, đèn và quà.</span><em>Bắt đầu trang trí →</em></button>
<button class="card" data-v="map"><i>⛪</i><b>Tìm giáo xứ gần bạn</b><span>Nhập địa chỉ để tìm giáo xứ, xem thời tiết và nhắc nhở nên mang gì.</span><em>Tìm kiếm →</em></button>
<button class="card" data-v="music"><i>🎶</i><b>Âm nhạc Giáng Sinh</b><span>Nghe giai điệu và lời bài hát cùng sóng âm nhiều màu sắc.</span><em>Nghe nhạc →</em></button>
<button class="card" data-v="gift"><i>🎁</i><b>Quà tặng ý nghĩa</b><span>Điền thông tin người nhận để nhận gợi ý món quà phù hợp kèm link mua.</span><em>Gợi ý quà →</em></button>
<button class="card" data-v="wish"><i>💌</i><b>Thiệp lời chúc</b><span>Mở một tấm thiệp để đọc lời chúc ý nghĩa dành cho bạn.</span><em>Mở thiệp →</em></button>
</section>
<footer>Merry Christmas &amp; Happy New Year!</footer>
</main>
<div id="modal" hidden><div id="panel"></div></div>

<script>
const BG_URL="https://hobiverse.com.vn/cdn/shop/articles/Jinx_9bca3e2a-29fb-4f36-81d8-e870f51800b0.jpg?v=1761030989";
if(BG_URL)document.documentElement.style.setProperty('--bg-img','url("'+BG_URL+'")');
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gm=q=>'https://www.google.com/maps/search/'+encodeURIComponent(q);

// Thông tin của tôi
$('#meb').onclick=()=>{$('#mel').hidden=!$('#mel').hidden};

// Tuyết rơi
const cv=$('#snow'),cx=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const fl=Array.from({length:Math.min(110,innerWidth/10|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.8,s:Math.random()+.4,d:Math.random()*6}));
(function dr(){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(255,255,255,.85)';for(const f of fl){f.y+=f.s;f.d+=.01;f.x+=Math.sin(f.d)*.5;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill()}requestAnimationFrame(dr)})();

// Ông già Noel sau 5 giây
const sa=$('#santa');function fly(){sa.classList.remove('fly');void sa.offsetWidth;sa.classList.add('fly')}
setTimeout(()=>{fly();setInterval(fly,30000)},5000);

// Cửa sổ nội dung
const modal=$('#modal'),panel=$('#panel');let cleanup=null;
function openV(v){panel.innerHTML='<button class="x" aria-label="Đóng">✕</button><div id="body"></div>';panel.querySelector('.x').onclick=closeV;modal.hidden=false;views[v]($('#body'))}
function closeV(){if(cleanup){cleanup();cleanup=null}modal.hidden=true}
modal.addEventListener('click',e=>{if(e.target===modal)closeV()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeV()});
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openV(c.dataset.v));

// Hỏi Claude (chỉ hoạt động khi trang được đăng tải)
async function askJSON(p){if(!window.claude)throw 0;const s=await claude.use('sample');if(!s)throw 0;return await s.json(p)}

// Cây thông
function treeSVG(){let s=11;const R=()=>(s=s*16807%2147483647)/2147483647,G=['#0b4a22','#14692f','#1f8a41','#2aa356','#0e5a28'];
 let o='<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7a3a"/><stop offset="1" stop-color="#0c3d1c"/></linearGradient><linearGradient id="tk2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4e3320"/><stop offset=".5" stop-color="#8a5b36"/><stop offset="1" stop-color="#4e3320"/></linearGradient><radialGradient id="mound"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9cde8"/></radialGradient></defs>';
 o+='<ellipse cx="160" cy="426" rx="130" ry="14" fill="#000" opacity=".35"/><rect x="143" y="378" width="34" height="46" fill="url(#tk2)"/>';
 for(let i=6;i>=0;i--){const ay=26+i*46,by=ay+88,hw=32+i*20,m=3+i,st=2*hw/m;
  let d=`M160 ${ay}L${160-hw} ${by}`;for(let k=0;k<m;k++)d+=`Q${160-hw+(k+.5)*st} ${by+18} ${160-hw+(k+1)*st} ${by}`;d+='Z';
  o+=`<path d="${d}" fill="url(#tg)" stroke="#07301a" stroke-width="1.5"/>`;
  for(let n=0;n<110;n++){const y=ay+10+R()*(by-ay-8),lim=hw*(y-ay)/(by-ay),x=160+(R()*2-1)*lim*.95,dx=(x-160)/(lim||1)*7,len=6+R()*7;
   o+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)}l${dx.toFixed(1)} ${len.toFixed(1)}" stroke="${G[R()*5|0]}" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>`}
  for(let k=0;k<m;k++){const x=160-hw+(k+.5)*st;o+=`<ellipse cx="${x.toFixed(1)}" cy="${by+9}" rx="${(st*.28).toFixed(1)}" ry="3" fill="#fff" opacity=".8"/>`}
  o+=`<path d="M160 ${ay}L${160-hw*.55} ${ay+(by-ay)*.55}" stroke="#fff" stroke-width="2" opacity=".25" stroke-linecap="round"/>`}
 return o+'<ellipse cx="160" cy="424" rx="105" ry="11" fill="url(#mound)"/>'}
const O={
 r:c=>`<svg viewBox="0 0 40 40"><rect x="17" y="3" width="6" height="7" rx="1.500" fill="url(#goldG)"/><circle cx="20" cy="24" r="14" fill="${c}"/><circle cx="20" cy="24" r="14" fill="url(#shine)"/></svg>`,
 star:'<svg viewBox="0 0 40 40"><polygon points="20,2 25,14.500 38,15.500 28,24 31.500,37 20,30 8.500,37 12,24 2,15.500 15,14.500" fill="url(#goldG)" stroke="#a87708"/><polygon points="20,2 25,14.500 20,20" fill="#fff" opacity=".35"/></svg>',
 gift:'<svg viewBox="0 0 40 40"><rect x="5" y="16" width="30" height="20" rx="2" fill="#c62839"/><rect x="5" y="16" width="30" height="20" rx="2" fill="url(#shine)" opacity=".5"/><rect x="18" y="16" width="4" height="20" fill="url(#goldG)"/><rect x="5" y="23" width="30" height="4" fill="url(#goldG)"/><path d="M20 16c-9-9-13 1-4 1zM20 16c9-9 13 1 4 1z" fill="none" stroke="#f4b400" stroke-width="2.500"/></svg>',
 bell:'<svg viewBox="0 0 40 40"><path d="M20 4c-6 0-9 5-9 11 0 6-3 9-5 12h28c-2-3-5-6-5-12 0-6-3-11-9-11z" fill="url(#goldG)" stroke="#a87708"/><circle cx="20" cy="31" r="3.500" fill="#a87708"/><path d="M15 11c-2 2-2 5-2 7" stroke="#fff" stroke-width="2" fill="none" opacity=".6" stroke-linecap="round"/></svg>',
 candy:'<svg viewBox="0 0 40 40"><g fill="none" stroke-linecap="round"><path d="M12 36V14a8 8 0 0 1 16 0" stroke="#fff" stroke-width="6"/><path d="M12 36V14a8 8 0 0 1 16 0" stroke="#d62839" stroke-width="6" stroke-dasharray="4 4.500"/></g></svg>',
 snow:'<svg viewBox="0 0 40 40"><g stroke="#e8f4ff" stroke-width="2.500" stroke-linecap="round"><path d="M20 4v32M5 12l30 16M5 28l30-16"/><path d="M16 7l4 3 4-3M16 33l4-3 4 3" fill="none" stroke-width="1.800"/></g><circle cx="20" cy="20" r="3" fill="#fff"/></svg>',

 const W=["Chúc bạn một mùa Giáng Sinh thật ấm áp. Mong rằng mọi lo toan của năm cũ sẽ tan đi như tuyết đầu đông, nhường chỗ cho bình an, sức khỏe và những khoảnh khắc sum vầy bên người thương yêu.",
 "Giáng Sinh là lúc để nhìn lại những điều giản dị mà quý giá. Chúc bạn luôn có người để sẻ chia, có nơi để trở về và có thật nhiều niềm tin để bước tiếp vào năm mới đầy hy vọng.",
 "Nguyện cho ánh đèn Noel soi sáng mọi ước mơ của bạn. Chúc bạn dũng cảm theo đuổi điều mình yêu thích, luôn được yêu thương và mỗi ngày trôi qua đều là một món quà đáng nhớ.",
 "Cảm ơn bạn vì đã là một phần của những ngày tháng đẹp. Chúc bạn Giáng Sinh này trọn vẹn tiếng cười, ấm áp tình thân và một năm mới bình an, thành công, hạnh phúc ngập tràn.",
 "Chúc cho trái tim bạn luôn nhẹ nhàng như bông tuyết và ấm áp như tách cacao đêm đông. Mong bạn gặp thật nhiều điều tử tế, và chính bạn cũng luôn là điều tử tế của người khác."];
 let last=-1;
 const draw=()=>{b.innerHTML=`<h2>💌 Thiệp chúc mừng</h2><p class="hint">Chạm vào tấm thiệp để mở ra lời chúc dành cho bạn.</p><div class="thiep" id="tp"><div><div style="font-size:3.2rem">🎄</div><div style="font-size:1.2rem">Gửi đến bạn<br><small>Chạm để mở thiệp</small></div></div></div><div style="text-align:center"><button class="alt" id="nx" style="display:none">💌 Thiệp khác</button></div>`;
  $('#tp').onclick=function(){if(this.classList.contains('open'))return;let i;do{i=Math.random()*W.length|0}while(i===last);last=i;this.classList.add('open');this.innerHTML='<p>'+W[i]+'<br><br>🎅 Merry Christmas!</p>';$('#nx').style.display='inline-block'};
  $('#nx').onclick=draw};
 draw();
}};
</script>
</body>
</html>
